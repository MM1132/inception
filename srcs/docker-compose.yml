services:
  nginx:
    build: ./requirements/nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      - inception-network
    depends_on:
      - wordpress
    volumes:
      - wordpress-data:/var/www/html

  wordpress:
    build: ./requirements/wordpress
    restart: unless-stopped
    networks:
      - inception-network
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
    secrets:
      - db_pass
    volumes:
      - wordpress-data:/var/www/html

  mariadb:
    build: ./requirements/mariadb
    restart: unless-stopped
    networks:
      - inception-network
    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
    secrets:
      - db_pass
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "sh", "-c", "mysqladmin ping -h localhost && mysql -u${DB_USER} -p$$(cat /run/secrets/db_pass) -e 'USE ${DB_NAME};' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  inception-network:
    driver: bridge

volumes:
  wordpress-data:
    driver: local
    driver_opts:
      type: bind
      o: bind
      device: ${HOME}/data/www
  mariadb-data:
    driver: local
    driver_opts:
      type: bind
      o: bind
      device: ${HOME}/data/db

secrets:
  db_pass:
    file: ../secrets/db_password.txt
