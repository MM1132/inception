# This is a server listening on port 80
# And the purpose of it is to redirect all stuff to port 443
server {
	listen 80;
	server_name rreimann.42.fr;
	return 301 https://$server_name$request_uri;
}

server {
	listen 443 ssl;
	server_name rreimann.42.fr;

	ssl_certificate /etc/ssl/certs/nginx-selfsigned.crt;
	ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;

	root /var/www/html;
	index index.php index.html;

	location / {
		try_files $uri $uri/ /index.php?$args;
	}

	# Regex match path
	location ~ \.php$ {
		# The ip of the other container is "wordpress" in our docker's DNS
		# This is used to forward the requests
		fastcgi_pass wordpress:9000;
		# Default page to be displayed
		fastcgi_index index.php;
		# Environment variables
		include fastcgi_params;
		# Tells php-fpm to execute this specific file on this specific path
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
	}
}
