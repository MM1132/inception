services:
  nginx:
    build: ./requirements/nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      - inception-network
    depends_on:
      - wordpress
    volumes:
      - wordpress-data:/var/www/html

  wordpress:
    build: ./requirements/wordpress
    restart: unless-stopped
    networks:
      - inception-network
    depends_on:
      - mariadb
    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
    secrets:
      - db_pass
    volumes:
      - wordpress-data:/var/www/html

  mariadb:
    build: ./requirements/mariadb
    restart: unless-stopped
    networks:
      - inception-network
    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
    secrets:
      - db_pass
    volumes:
      - mariadb-data:/var/lib/mysql

networks:
  inception-network:
    driver: bridge

volumes:
  wordpress-data:
    driver: local
    driver_opts:
      type: bind
      o: bind
      device: /home/robert/data/www
  mariadb-data:
    driver: local
    driver_opts:
      type: bind
      o: bind
      device: /home/robert/data/db

secrets:
  db_pass:
    file: ../secrets/db_password.txt
